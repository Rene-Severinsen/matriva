nt-weight="700">CANONICAL SITE ELEMENTS</text><text class="small" x="1135" y="240">Grey: driveway, front path, terrace</text><text class="small" x="1135" y="268">Green edge: mixed perimeter hedge</text><text class="small" x="1135" y="296">BED_01 / BED_02: varied perennial,</text><text class="small" x="1135" y="316">ornamental-grass and shrub planting</text><text class="small" x="1135" y="344">TREE_01 / TREE_02: fixed tree locations</text><text class="small" x="1135" y="372">Seasonal growth and planting mix may vary;</text><text class="small" x="1135" y="392">permanent spatial positions may not.</text><text class="small" x="1135" y="432">No repeated spherical-shrub pattern.</text><text class="small" x="1135" y="462">Approved canonical site decision.</text><text class="small" x="100" y="1015">Site boundary: 30 m × 26 m · house origin: 6.8 m east, 6.5 m north of site south-west corner.</text>
