<rect width="100%" height="100%" fill="#fbfcfa"/><text class="title" x="50" y="46">02 · CANONICAL ROOF PLAN</text><text class="subtitle" x="50" y="72">One symmetrical hipped roof: mathematically derived ridge, eaves, gutters and four downpipes.</text><line x1="50" y1="92" x2="1070" y2="92" stroke="#dfe6e2"/><rect x="50" y="108" width="1020" height="32" rx="4" fill="#e9f3e9" stroke="#9ebfa0"/><text x="64" y="129" font-size="12" font-weight="700" fill="#2f6736">APPROVED CURRENT SOURCE OF TRUTH · future changes begin in this canonical model, never in a derived image.</text><rect x="110" y="165" width="692" height="516" fill="#20282c" stroke="#172020" stroke-width="3"/><polygon points="110,165 802,165 544,423 368,423" fill="#29343a" stroke="#66757a" stroke-width="1"/><polygon points="110,681 802,681 544,423 368,423" fill="#1a2226" stroke="#66757a" stroke-width="1"/><line x1="110" y1="165" x2="368" y2="423" stroke="#66757a"/><line x1="802" y1="165" x2="544" y2="423" stroke="#66757a"/><line x1="110" y1="681" x2="368" y2="423" stroke="#66757a"/><line x1="802" y1="681" x2="544" y2="423" stroke="#66757a"/><line x1="368" y1="423" x2="544" y2="423" stroke="#d5e0e2" stroke-width="4"/><circle cx="110" cy="681" r="6" fill="#bd7d32" stroke="#fff" stroke-width="1.5"/><text class="small" x="120" y="673">DP_01</text><circle cx="802" cy="681" r="6" fill="#bd7d32" stroke="#fff" stroke-width="1.5"/><text class="small" x="812" y="673">DP_02</text><circle cx="802" cy="165" r="6" fill="#bd7d32" stroke="#fff" stroke-width="1.5"/><text class="small" x="812" y="157">DP_03</text><circle cx="110" cy="165" r="6" fill="#bd7d32" stroke="#fff" stroke-width="1.5"/><text class="small" x="120" y="157">DP_04</text><text class="label" x="456" y="413" text-anchor="middle" fill="#fff">RIDGE · 4.4 m · east–west</text><text class="small" x="124" y="188" fill="#fff">25° hipped roof · 450 mm continuous eaves</text><rect x="750" y="165" width="320" height="195" rx="8" fill="#f0f4f1" stroke="#dfe6e2"/><text class="label" x="770" y="194" font-weight="700">ROOF CONTRACT</text><text class="small" x="770" y="220">Pitch: 25°</text><text class="small" x="770" y="242">Eaves: 2700 mm above FFL</text><text class="small" x="770" y="264">Ridge: 5707 mm above FFL</text><text class="small" x="770" y="286">Gutter: continuous black perimeter</text><text class="small" x="770" y="308">No chimney, dormer, roof window</text><text class="small" x="770" y="330">or unlisted penetration.</text><text class="small" x="110" y="746">The outer roof is the same 16.4 m × 12.0 m footprint with a fixed 450 mm eaves projection. Orange points are fixed downpipes.</text>
