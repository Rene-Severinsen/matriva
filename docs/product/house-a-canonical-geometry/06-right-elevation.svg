<rect width="100%" height="100%" fill="#fbfcfa"/><text class="title" x="50" y="46">06 · RIGHT ELEVATION</text><text class="subtitle" x="50" y="72">2 stable openings derived from the canonical floor plan. Dark roof, pale brick and black frames are visual intent from A01.</text><line x1="50" y1="92" x2="1070" y2="92" stroke="#dfe6e2"/><rect x="50" y="108" width="1020" height="32" rx="4" fill="#e9f3e9" stroke="#9ebfa0"/><text x="64" y="129" font-size="12" font-weight="700" fill="#2f6736">APPROVED CURRENT SOURCE OF TRUTH · future changes begin in this canonical model, never in a derived image.</text><line x1="95" y1="475" x2="575" y2="475" stroke="#172020" stroke-width="2"/><rect x="95" y="367" width="480" height="108" fill="#f2ecdf" stroke="#172020" stroke-width="2"/><polygon points="95,367 575,367 335,246.72 335,246.72" fill="#20282c" stroke="#172020" stroke-width="2"/><line x1="335" y1="246.72" x2="335" y2="246.72" stroke="#cbd7da" stroke-width="2" stroke-dasharray="5 4"/><rect x="147" y="395" width="48" height="48" fill="#a9c9d8" stroke="#172020" stroke-width="1.3"/><text class="small" x="171" y="388" text-anchor="middle">RIGHT_WINDOW_01</text><rect x="427" y="395" width="80" height="48" fill="#a9c9d8" stroke="#172020" stroke-width="1.3"/><text class="small" x="467" y="388" text-anchor="middle">RIGHT_WINDOW_02</text><text class="small" x="95" y="501">RIGHT · 12 m facade span</text><rect x="770" y="170" width="300" height="190" rx="8" fill="#f0f4f1" stroke="#dfe6e2"/><text class="label" x="790" y="198" font-weight="700">ELEVATION RULES</text><text class="small" x="790" y="225">Eaves: 2700 mm</text><text class="small" x="790" y="247">Ridge: 5707 mm</text><text class="small" x="790" y="269">Roof pitch: 25°</text><text class="small" x="790" y="291">All opening IDs, offsets,</text><text class="small" x="790" y="313">sizes and sills are immutable</text><text class="small" x="790" y="335">unless this source JSON changes.</text><text class="small" x="95" y="585">This is an 