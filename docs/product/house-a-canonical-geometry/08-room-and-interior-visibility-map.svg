<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
<title id="title">House A room and interior visibility map</title><desc id="description">Deterministic technical drawing derived from House A canonical geometry JSON.</desc>
<style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#172020}.subtitle{font-size:15px;fill:#53635d}.label{font-size:13px;fill:#172020}.small{font-size:11px;fill:#53635d}.dim{font-size:12px;fill:#53635d}.tablehead{font-size:12px;font-weight:700;fill:#fff}.cell{font-size:12px;fill:#172020}</style>
<rect width="100%" height="100%" fill="#fbfcfa"/><text class="title" x="50" y="46">08 · ROOM MAP + INTERIOR VISIBILITY MAP</text><text class="subtitle" x="50" y="72">Each exterior opening has one room assignment and a deliberately domestic visibility contract.</text><line x1="50" y1="92" x2="1550" y2="92" stroke="#dfe6e2"/><rect x="50" y="108" width="1500" height="32" rx="4" fill="#e9f3e9" stroke="#9ebfa0"/><text x="64" y="129" font-size="12" font-weight="700" fill="#2f6736">APPROVED CURRENT SOURCE OF TRUTH · future changes begin in this canonical model, never in a derived image.</text><rect x="50" y="170" width="492" height="360" fill="#fff" stroke="#172020" stroke-width="3"/><polygon points="50,530 224,530 224,314 50,314" fill="#d8dce0" stroke="#172020" stroke-width="1.4"/><text x="137" y="422" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Garage</text><polygon points="224,530 290,530 290,425 224,425" fill="#d9e8e6" stroke="#172020" stroke-width="1.4"/><text x="257" y="477.5" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Bryggers</text><polygon points="290,530 350,530 350,440 290,440" fill="#f6ead7" stroke="#172020" stroke-width="1.4"/><text x="320" y="485" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Entré</text><polygon points="224,425 290,425 290,350 224,350" fill="#e9dfd0" stroke="#172020" stroke-width="1.4"/><text x="257" y="387.5" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Bad</text><polygon points="350,530 446,530 446,425 350,425" fill="#dfe8f0" stroke="#172020" stroke-width="1.4"/><text x="398" y="477.5" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Værelse 1</text><polygon points="446,530 542,530 542,425 446,425" fill="#dfe8f0" stroke="#172020" stroke-width="1.4"/><text x="494" y="477.5" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Værelse 2</text><polygon points="50,314 179,314 179,170 50,170" fill="#dfe8f0" stroke="#172020" stroke-width="1.4"/><text x="114.5" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Soveværelse</text><polygon points="179,335 398,335 398,170 179,170" fill="#e7efd8" stroke="#172020" stroke-width="1.4"/><text x="288.5" y="252.5" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Køkken / alrum</text><polygon points="398,335 542,335 542,170 398,170" fill="#f5e7d6" stroke="#172020" stroke-width="1.4"/><text x="470" y="252.5" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Stue</text><polygon points="224,350 290,350 290,440 350,440 350,425 542,425 542,335 290,335 290,314 224,314" fill="#f2f0e8" stroke="#172020" stroke-width="1.4"/><text x="339.2" y="372.79999999999995" text-anchor="middle" font-size="10" font-weight="700" fill="#172020">Fordeling / gang</text><line x1="62" y1="530" x2="212" y2="530" stroke="#a14d21" stroke-width="6"/><line x1="303.5" y1="530" x2="336.5" y2="530" stroke="#a14d21" stroke-width="6"/><line x1="368" y1="530" x2="422" y2="530" stroke="#256b87" stroke-width="6"/><line x1="464" y1="530" x2="518" y2="530" stroke="#256b87" stroke-width="6"/><line x1="80" y1="170" x2="134" y2="170" stroke="#256b87" stroke-width="6"/><line x1="194" y1="170" x2="290" y2="170" stroke="#a14d21" stroke-width="6"/><line x1="305" y1="170" x2="359" y2="170" stroke="#256b87" stroke-width="6"/><line x1="413" y1="170" x2="503" y2="170" stroke="#a14d21" stroke-width="6"/><line x1="50" y1="386" x2="50" y2="356" stroke="#a14d21" stroke-width="6"/><line x1="50" y1="281" x2="50" y2="239" stroke="#256b87" stroke-width="6"/><line x1="542" y1="491" x2="542" y2="455" stroke="#256b87" stroke-width="6"/><line x1="542" y1="281" x2="542" y2="221" stroke="#256b87" stroke-width="6"/><rect x="600" y="170" width="950" height="250" rx="8" fill="#f0f4f1" stroke="#dfe6e2"/><text class="label" x="625" y="200" font-weight="700">INTERIOR CONSISTENCY CONTRACT</text><text class="small" x="625" y="228">Kitchen / alrum may show an island, dining table and pendants only through its assigned openings.</text><text class="small" x="625" y="254">Living room may show sofa-led furnishing only through REAR_SLIDER_02 and RIGHT_WINDOW_02.</text><text class="small" x="625" y="280">Bedrooms remain bedroom-scale; garage stays non-domestic. No repeated dining set across multiple rooms.</text><text class="small" x="625" y="306">Future renders must be rejected if visible furniture conflicts with this map or makes the home read as a hall, restaurant, hotel or showroom.</text><rect x="50" y="510" width="300" height="44" fill="#172020"/><text class="tablehead" x="58" y="533">Opening</text><rect x="350" y="510" width="300" height="44" fill="#172020"/><text class="tablehead" x="358" y="533">Room behind opening</text><rect x="650" y="510" width="900" height="44" fill="#172020"/><text class="tablehead" x="658" y="533">Allowed visible interior elements</text><rect x="50" y="554" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="577">GARAGE_DOOR_01</text><rect x="350" y="554" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="358" y="577">Garage</text><rect x="650" y="554" width="900" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="658" y="577">parked car or storage only; no domestic furniture</text><rect x="50" y="598" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="58" y="621">FRONT_DOOR_01</text><rect x="350" y="598" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="358" y="621">Entré</text><rect x="650" y="598" width="900" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="658" y="621">entry circulation; no staged repeated interior</text><rect x="50" y="642" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="665">FRONT_WINDOW_01</text><rect x="350" y="642" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="358" y="665">Værelse 1</text><rect x="650" y="642" width="900" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="658" y="665">bed, bedside table, one reading lamp</text><rect x="50" y="686" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="58" y="709">FRONT_WINDOW_02</text><rect x="350" y="686" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="358" y="709">Værelse 2</text><rect x="650" y="686" width="900" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="658" y="709">bed or desk, restrained personal storage</text><rect x="50" y="730" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="753">REAR_WINDOW_01</text><rect x="350" y="730" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="358" y="753">Soveværelse</text><rect x="650" y="730" width="900" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="658" y="753">bed, bedside tables, soft textiles</text><rect x="50" y="774" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="58" y="797">REAR_SLIDER_01</text><rect x="350" y="774" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="358" y="797">Køkken / alrum</text><rect x="650" y="774" width="900" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="658" y="797">kitchen island, dining table, pendant lights</text><rect x="50" y="818" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="841">REAR_WINDOW_02</text><rect x="350" y="818" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="358" y="841">Køkken / alrum</text><rect x="650" y="818" width="900" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="658" y="841">kitchen worktop, plants, restrained table setting</text><rect x="50" y="862" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="58" y="885">REAR_SLIDER_02</text><rect x="350" y="862" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="358" y="885">Stue</text><rect x="650" y="862" width="900" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="658" y="885">sofa, coffee table, floor lamp, art or low shelving</text><rect x="50" y="906" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="929">LEFT_GARAGE_DOOR_01</text><rect x="350" y="906" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="358" y="929">Garage</text><rect x="650" y="906" width="900" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="658" y="929">garage circulation only</text><rect x="50" y="950" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="58" y="973">LEFT_WINDOW_01</text><rect x="350" y="950" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="358" y="973">Soveværelse</text><rect x="650" y="950" width="900" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="658" y="973">bed, calm textile palette</text><rect x="50" y="994" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="1017">RIGHT_WINDOW_01</text><rect x="350" y="994" width="300" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="358" y="1017">Værelse 2</text><rect x="650" y="994" width="900" height="44" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="658" y="1017">bed or desk, one reading lamp</text><rect x="50" y="1038" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="58" y="1061">RIGHT_WINDOW_02</text><rect x="350" y="1038" width="300" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="358" y="1061">Stue</text><rect x="650" y="1038" width="900" height="44" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="658" y="1061">sofa side, floor lamp, art or low shelving</text>
