<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title description">
<title id="title">House A materials and immutable geometry rules</title><desc id="description">Deterministic technical drawing derived from House A canonical geometry JSON.</desc>
<style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#172020}.subtitle{font-size:15px;fill:#53635d}.label{font-size:13px;fill:#172020}.small{font-size:11px;fill:#53635d}.dim{font-size:12px;fill:#53635d}.tablehead{font-size:12px;font-weight:700;fill:#fff}.cell{font-size:12px;fill:#172020}</style>
<rect width="100%" height="100%" fill="#fbfcfa"/><text class="title" x="50" y="46">10 · MATERIAL SPECIFICATION + IMMUTABLE RULES</text><text class="subtitle" x="50" y="72">A01 is the visual/material authority only. Manufacturer choices remain unspecified; geometry is approved canonical source data.</text><line x1="50" y1="92" x2="1550" y2="92" stroke="#dfe6e2"/><rect x="50" y="108" width="1500" height="32" rx="4" fill="#e9f3e9" stroke="#9ebfa0"/><text x="64" y="129" font-size="12" font-weight="700" fill="#2f6736">APPROVED CURRENT SOURCE OF TRUTH · future changes begin in this canonical model, never in a derived image.</text><rect x="50" y="170" width="220" height="43" fill="#172020"/><text class="tablehead" x="58" y="193">Element</text><rect x="270" y="170" width="390" height="43" fill="#172020"/><text class="tablehead" x="278" y="193">Visual specification</text><rect x="660" y="170" width="480" height="43" fill="#172020"/><text class="tablehead" x="668" y="193">Source / authority</text><rect x="1140" y="170" width="350" height="43" fill="#172020"/><text class="tablehead" x="1148" y="193">Product / build-up</text><rect x="50" y="213" width="220" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="236">Facade</text><rect x="270" y="213" width="390" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="278" y="236">light warm brick</text><rect x="660" y="213" width="480" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="668" y="236">A01 observed visual/material reference</text><rect x="1140" y="213" width="350" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="1148" y="236">not specified</text><rect x="50" y="256" width="220" height="43" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="58" y="279">Roof</text><rect x="270" y="256" width="390" height="43" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="278" y="279">dark/black low-profile tiled roof</text><rect x="660" y="256" width="480" height="43" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="668" y="279">A01 observed visual/material reference</text><rect x="1140" y="256" width="350" height="43" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="1148" y="279">not specified</text><rect x="50" y="299" width="220" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="322">Windows and external doors</text><rect x="270" y="299" width="390" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="278" y="322">slim black frames; black front door</text><rect x="660" y="299" width="480" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="668" y="322">A01 observed visual/material reference</text><rect x="1140" y="299" width="350" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="1148" y="322">not specified</text><rect x="50" y="342" width="220" height="43" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="58" y="365">Gutters and downpipes</text><rect x="270" y="342" width="390" height="43" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="278" y="365">black</text><rect x="660" y="342" width="480" height="43" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="668" y="365">A01 observed visual/material reference</text><rect x="1140" y="342" width="350" height="43" fill="#f5f7f5" stroke="#dfe6e2"/><text class="cell" x="1148" y="365">not specified</text><rect x="50" y="385" width="220" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="58" y="408">Hard landscape</text><rect x="270" y="385" width="390" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="278" y="408">restrained grey concrete paving</text><rect x="660" y="385" width="480" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="668" y="408">approved canonical design decision</text><rect x="1140" y="385" width="350" height="43" fill="#fff" stroke="#dfe6e2"/><text class="cell" x="1148" y="408">not specified</text><text class="label" x="50" y="485" font-weight="700">IMMUTABLE GEOMETRY RULES</text><circle cx="68" cy="516" r="12" fill="#172020"/><text x="68" y="520" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text class="label" x="92" y="520">The footprint is the single 16,400 mm × 12,000 mm rectangle defined by C01–C04; no view may add, remove or offset a volume.</text><circle cx="68" cy="583" r="12" fill="#172020"/><text x="68" y="587" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text class="label" x="92" y="587">GARAGE_01 is 5,800 mm × 7,200 mm at the front-west corner in every plan, elevation and derived render.</text><circle cx="68" cy="650" r="12" fill="#172020"/><text x="68" y="654" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text class="label" x="92" y="654">The roof is one symmetrical 25° hipped roof across the complete footprint, with 450 mm eaves, east-west ridge and no unmodelled penetrations.</text><circle cx="68" cy="717" r="12" fill="#172020"/><text x="68" y="721" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text><text class="label" x="92" y="721">Every exterior opening is identified by its stable ID and may occur only on its listed facade, at its listed offset, size, sill and room.</text><circle cx="68" cy="784" r="12" fill="#172020"/><text x="68" y="788" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text><text class="label" x="92" y="788">Terrace, driveway, front path, perimeter hedge and listed tree/bed positions are canonical site elements; seasonal planting may vary without moving them.</text><circle cx="68" cy="851" r="12" fill="#172020"/><text x="68" y="855" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text><text class="label" x="92" y="855">A01 supplies visual/material intent only. The canonical geometry JSON supplies architecture; neither A02–A15 nor later imagery may modify it.</text><circle cx="68" cy="918" r="12" fill="#172020"/><text x="68" y="922" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text><text class="label" x="92" y="922">Future photorealistic render prompts, edits and QA must be derived from this model and must be rejected on any geometric conflict.</text>
</svg>
